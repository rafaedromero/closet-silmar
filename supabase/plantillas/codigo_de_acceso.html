<!-- Supabase › Authentication › Emails › Magic Link
     Asunto sugerido: Tu código para entrar a Mi Closet -->
<div style="background:#f5efe6;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#1c1817">
  <div style="max-width:420px;margin:0 auto;background:#ffffff;border:1px solid #c8a46a;border-radius:16px;padding:32px 24px;text-align:center">
    <p style="margin:0;font-size:13px;letter-spacing:4px;text-transform:uppercase;color:#6b5e52">Mi Closet</p>
    <h1 style="margin:12px 0 8px;font-size:20px;font-weight:600">Tu código para entrar al panel</h1>
    <p style="margin:0 0 24px;font-size:14px;color:#6b5e52">Escríbelo en la pantalla donde lo pediste. Vence en una hora.</p>
    <p style="margin:0 0 24px;font-size:34px;font-weight:600;letter-spacing:8px;color:#1c1817">{{ .Token }}</p>
    <p style="margin:0 0 8px;font-size:13px;color:#6b5e52">Si estás en el navegador, también puedes entrar con este botón:</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1c1817;color:#f5efe6;text-decoration:none;padding:12px 28px;border-radius:999px;font-size:14px">Entrar al panel</a>
    <p style="margin:24px 0 0;font-size:12px;color:#8a7a63">Si no pediste este código, ignora este correo.</p>
  </div>
</div>
